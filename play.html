<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<base href="/"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
<title>HAIN</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;color:#ccc;font-family:system-ui,sans-serif}
  /* IMPORTANTE: no forzar width/height del canvas. El runner de GameMaker asume que el tamaño CSS
     es igual al tamaño interno del canvas; si se estira, el mouse y el loading quedan desplazados. */
  canvas{position:absolute;top:50%;left:50%;bottom:-50%;right:-50%;transform:translate(-50%,-50%);
    image-rendering:optimizeSpeed;touch-action:none;outline:none}
  #fs{position:fixed;right:6px;top:6px;z-index:20;width:36px;height:36px;padding:0;border:2px solid rgba(255,255,255,.85);border-radius:9px;cursor:pointer;
      background:rgba(20,20,40,.85);color:#fff;opacity:.9;display:none;align-items:center;justify-content:center}
  #fs:hover{opacity:1}
  #fs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #loading_screen{display:none!important}   /* loading gris por defecto de GameMaker */
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding-bottom:7vh;
    background:#080916 url(card.png) center/contain no-repeat;cursor:pointer;z-index:10;color:#fff}
  #start .btn{background:rgba(0,0,0,.65);padding:12px 28px;border-radius:8px;font-size:clamp(14px,3vw,22px);letter-spacing:.1em}
  #start .bar{display:none;width:min(40vw,320px);height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
  #start .bar i{display:block;height:100%;width:40%;background:#f0c040;border-radius:3px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #start.loading{cursor:progress;pointer-events:none}
  #start.loading .bar{display:block}
</style>
</head>
<body>
<div class="gm4html5_div_class" id="gm4html5_div_id">
  <canvas id="canvas" width="1024" height="576" tabindex="0"></canvas>
</div>
<button id="fs" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div id="start"><div class="btn" id="msg">▶ PLAY</div><div class="bar"><i></i></div></div>

<script src="html5game/HAIN.js?cachebust=1613019247"></script>
<script>
  // Click para arrancar: el navegador exige un gesto del usuario para habilitar el audio
  // y le da foco al iframe (necesario para el teclado dentro de X).
  var started = false;
  function go(){
    if (started) return; started = true;
    var st = document.getElementById('start');
    st.classList.add('loading');
    document.getElementById('msg').textContent = 'Loading…';
    GameMaker_Init();
    document.getElementById('canvas').focus();
    // El runner crea #loading_screen mientras carga y lo elimina al terminar.
    var t0 = Date.now(), seen = false;
    var iv = setInterval(function(){
      var exists = !!document.getElementById('loading_screen');
      if (exists) seen = true;
      if ((seen && !exists) || (!seen && Date.now() - t0 > 10000)) {
        clearInterval(iv); st.remove(); document.getElementById('canvas').focus();
      }
    }, 100);
  }
  document.getElementById('start').addEventListener('pointerdown', go);

  // Botón de pantalla completa: se muestra cuando la página está dentro de X (iframe de otro dominio)
  // o abierta sola. Si el navegador/X no permite fullscreen, abre el juego en una pestaña nueva.
  var fs = document.getElementById('fs');
  var inOwnPage = false;
  try { inOwnPage = (window.parent !== window) && !!window.parent.document; } catch(e) { inOwnPage = false; }
  if (!inOwnPage) fs.style.display = 'flex';
  fs.addEventListener('click', function(e){
    e.stopPropagation();
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    var inFrame = (window.parent !== window);
    if (req && document.fullscreenEnabled !== false) {
      var r = req.call(el);
      if (r && r.catch) r.catch(function(){ window.open('/', '_blank'); });
    } else {
      window.open(inFrame ? '/' : location.href, '_blank');
    }
  });
  document.addEventListener('keydown', function(e){ if(!started && (e.key==='Enter'||e.key===' ')) go(); });
</script>
</body>
</html>
