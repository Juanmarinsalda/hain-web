<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<base href="/"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
<title>HAIN</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;color:#ccc;font-family:system-ui,sans-serif}
  canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(100vw,calc(100vh*1024/576));height:min(100vh,calc(100vw*576/1024));
    image-rendering:optimizeSpeed;touch-action:none;outline:none}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#000 url(card.png) center/contain no-repeat;cursor:pointer;z-index:10}
  #start span{background:rgba(0,0,0,.65);padding:14px 28px;border-radius:8px;font-size:22px;letter-spacing:.1em;color:#fff}
</style>
</head>
<body>
<div class="gm4html5_div_class" id="gm4html5_div_id">
  <canvas id="canvas" width="1024" height="576" tabindex="0"></canvas>
</div>
<div id="start"><span>▶ JUGAR</span></div>

<script src="html5game/HAIN.js?cachebust=1613019247"></script>
<script>
  // Click para arrancar: el navegador exige un gesto del usuario para habilitar el audio
  // y le da foco al iframe (necesario para el teclado dentro de X).
  var started = false;
  function go(){
    if (started) return; started = true;
    document.getElementById('start').remove();
    GameMaker_Init();
    document.getElementById('canvas').focus();
  }
  document.getElementById('start').addEventListener('pointerdown', go);
  document.addEventListener('keydown', function(e){ if(!started && (e.key==='Enter'||e.key===' ')) go(); });
</script>
</body>
</html>
